<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>SRM AP DayPass - Security Scanner</title>

    <script
        src="https://unpkg.com/html5-qrcode"
        defer>
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #123b67 0%, transparent 35%),
                radial-gradient(circle at bottom right, #073b4c 0%, transparent 35%),
                #050b14;
            color: #ffffff;
        }

        .header {
            width: 100%;
            padding: 18px 24px;
            border-bottom: 1px solid rgba(255,255,255,.12);
            background: rgba(5,11,20,.82);
            backdrop-filter: blur(18px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #00d9ff, #2563eb);
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(0,217,255,.25);
        }

        .brand h1 {
            font-size: 18px;
            line-height: 1.2;
        }

        .brand p {
            font-size: 12px;
            color: #9fb0c5;
            margin-top: 3px;
        }

        .role {
            padding: 9px 14px;
            border-radius: 999px;
            background: rgba(0,217,255,.1);
            border: 1px solid rgba(0,217,255,.3);
            color: #62eaff;
            font-size: 12px;
            font-weight: bold;
        }

        .container {
            width: min(1100px, calc(100% - 30px));
            margin: 30px auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 25px;
        }

        .hero h2 {
            font-size: clamp(26px, 5vw, 40px);
            margin-bottom: 8px;
        }

        .hero p {
            color: #9fb0c5;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .card {
            background: rgba(10,20,35,.78);
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
            backdrop-filter: blur(18px);
        }

        .card h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        #reader {
            width: 100%;
            min-height: 310px;
            border-radius: 18px;
            overflow: hidden;
            background: #02060b;
            border: 1px solid rgba(0,217,255,.18);
        }

        #reader video {
            border-radius: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        button,
        .file-label {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
            text-align: center;
        }

        button:hover,
        .file-label:hover {
            transform: translateY(-1px);
        }

        button:disabled,
        .file-label.disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
        }

        .primary {
            background: linear-gradient(135deg, #00d9ff, #2563eb);
            color: white;
        }

        .secondary {
            background: rgba(255,255,255,.08);
            color: white;
            border: 1px solid rgba(255,255,255,.12);
        }

        .file-label {
            display: block;
            background: rgba(0,217,255,.10);
            border: 1px solid rgba(0,217,255,.25);
            color: #6deeff;
        }

        #fileInput {
            display: none;
        }

        .message {
            margin-top: 15px;
            padding: 13px 15px;
            border-radius: 12px;
            display: none;
            font-size: 14px;
            line-height: 1.45;
        }

        .message.info {
            display: block;
            background: rgba(59,130,246,.12);
            border: 1px solid rgba(59,130,246,.3);
            color: #9cc7ff;
        }

        .message.success {
            display: block;
            background: rgba(34,197,94,.12);
            border: 1px solid rgba(34,197,94,.3);
            color: #7df0a3;
        }

        .message.error {
            display: block;
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(239,68,68,.3);
            color: #ff9b9b;
        }

        .result {
            display: none;
        }

        .result.show {
            display: block;
        }

        .status {
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 18px;
            text-align: center;
            font-weight: bold;
        }

        .status.success {
            background: rgba(34,197,94,.13);
            border: 1px solid rgba(34,197,94,.3);
            color: #79f2a0;
        }

        .status.error {
            background: rgba(239,68,68,.13);
            border: 1px solid rgba(239,68,68,.3);
            color: #ff9d9d;
        }

        .details {
            display: grid;
            gap: 10px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #8fa2b8;
            font-size: 13px;
        }

        .value {
            text-align: right;
            font-weight: bold;
            font-size: 14px;
            word-break: break-word;
        }

        .logout {
            margin-top: 20px;
            width: 100%;
            background: rgba(239,68,68,.10);
            border: 1px solid rgba(239,68,68,.25);
            color: #ff9b9b;
        }

        .empty {
            color: #8495a9;
            text-align: center;
            padding: 40px 10px;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 14px;
            }

            .brand h1 {
                font-size: 15px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            #reader {
                min-height: 280px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="brand">
        <div class="logo">S</div>

        <div>
            <h1>SRM AP DayPass</h1>
            <p>Secure Entry Verification</p>
        </div>
    </div>

    <div id="roleBadge" class="role">
        SECURITY
    </div>

</header>


<main class="container">

    <section class="hero">
        <h2>Security QR Scanner</h2>
        <p>Scan a student's DayPass QR to verify entry.</p>
    </section>


    <div class="grid">

        <!-- SCANNER -->

        <section class="card">

            <h3>📷 Scan DayPass QR</h3>

            <div id="reader"></div>

            <div class="buttons">

                <button
                    id="startButton"
                    class="primary"
                    type="button">
                    Start Camera
                </button>

                <button
                    id="stopButton"
                    class="secondary"
                    type="button"
                    disabled>
                    Stop Camera
                </button>

            </div>


            <label
                id="fileLabel"
                class="file-label"
                for="fileInput"
                style="margin-top:12px;">
                🖼️ Scan QR From Gallery
            </label>

            <input
                id="fileInput"
                type="file"
                accept="image/*">


            <div
                id="message"
                class="message">
            </div>

        </section>


        <!-- RESULT -->

        <section class="card">

            <h3>Verification Result</h3>

            <div
                id="emptyResult"
                class="empty">
                Scan a DayPass QR to see verification details.
            </div>


            <div
                id="result"
                class="result">

                <div
                    id="resultStatus"
                    class="status">
                </div>

                <div class="details">

                    <div class="row">
                        <span class="label">
                            Student Name
                        </span>

                        <span
                            id="studentName"
                            class="value">
                            —
                        </span>
                    </div>


                    <div class="row">
                        <span class="label">
                            Student ID
                        </span>

                        <span
                            id="studentId"
                            class="value">
                            —
                        </span>
                    </div>


                    <div class="row">
                        <span class="label">
                            Student Type
                        </span>

                        <span
                            id="studentType"
                            class="value">
                            —
                        </span>
                    </div>


                    <div class="row">
                        <span class="label">
                            Verified By
                        </span>

                        <span
                            id="verifiedBy"
                            class="value">
                            —
                        </span>
                    </div>


                    <div class="row">
                        <span class="label">
                            Verified Role
                        </span>

                        <span
                            id="verifiedRole"
                            class="value">
                            —
                        </span>
                    </div>


                    <div class="row">
                        <span class="label">
                            Date & Time
                        </span>

                        <span
                            id="verifiedAt"
                            class="value">
                            —
                        </span>
                    </div>

                </div>

            </div>


            <button
                id="logoutButton"
                class="logout"
                type="button">
                Logout
            </button>

        </section>

    </div>

</main>


<script>
"use strict";


/* =========================
   GLOBAL VARIABLES
========================= */

let scanner = null;
let scanning = false;
let processing = false;


/* =========================
   ELEMENTS
========================= */

const reader =
    document.getElementById("reader");

const startButton =
    document.getElementById("startButton");

const stopButton =
    document.getElementById("stopButton");

const fileInput =
    document.getElementById("fileInput");

const fileLabel =
    document.getElementById("fileLabel");

const logoutButton =
    document.getElementById("logoutButton");

const message =
    document.getElementById("message");

const roleBadge =
    document.getElementById("roleBadge");

const result =
    document.getElementById("result");

const emptyResult =
    document.getElementById("emptyResult");

const resultStatus =
    document.getElementById("resultStatus");

const studentName =
    document.getElementById("studentName");

const studentId =
    document.getElementById("studentId");

const studentType =
    document.getElementById("studentType");

const verifiedBy =
    document.getElementById("verifiedBy");

const verifiedRole =
    document.getElementById("verifiedRole");

const verifiedAt =
    document.getElementById("verifiedAt");


/* =========================
   AUTH TOKEN
========================= */

function getToken() {

    return (
        sessionStorage.getItem("entrypass_token") ||
        localStorage.getItem("entrypass_token") ||
        sessionStorage.getItem("token") ||
        localStorage.getItem("token") ||
        sessionStorage.getItem("idToken") ||
        localStorage.getItem("idToken") ||
        ""
    );
}


/* =========================
   API REQUEST
========================= */

async function apiRequest(
    url,
    options = {}
) {

    const headers = {
        ...(options.headers || {})
    };


    if (options.body) {
        headers["Content-Type"] =
            "application/json";
    }


    const authToken =
        getToken();


    if (authToken) {

        headers["Authorization"] =
            "Bearer " + authToken;
    }


    const response =
        await fetch(
            url,
            {
                ...options,

                headers,

                credentials:
                    "same-origin",

                cache:
                    "no-store"
            }
        );


    let data = {};

    try {

        data =
            await response.json();

    } catch {

        data = {};
    }


    if (!response.ok) {

        const error =
            new Error(
                data.error ||
                data.message ||
                "Request failed"
            );

        error.status =
            response.status;

        error.data =
            data;

        throw error;
    }


    return data;
}


/* =========================
   MESSAGES
========================= */

function showMessage(
    text,
    type = "info"
) {

    message.textContent =
        text;

    message.className =
        "message " + type;
}


function hideMessage() {

    message.textContent =
        "";

    message.className =
        "message";
}


/* =========================
   RESULT RESET
========================= */
function resetResult() {
    result.classList.remove("show");
    emptyResult.style.display = "block";

    resultStatus.textContent = "";
    resultStatus.className = "status";

    studentName.textContent = "—";
    studentId.textContent = "—";
    studentType.textContent = "—";

    verifiedBy.textContent = "—";
    verifiedRole.textContent = "—";
    verifiedAt.textContent = "—";
}

/* =========================
   DISPLAY SUCCESS
========================= */

function showSuccess(data) {

    const user =
        data.user ||
        data.student ||
        {};

    emptyResult.style.display = "none";
    result.classList.add("show");

    resultStatus.textContent = "✓ ENTRY VERIFIED";
    resultStatus.className = "status success";

    studentName.textContent =
        data.studentName ||
        user.studentName ||
        user.name ||
        "—";

    studentId.textContent =
        data.studentId ||
        user.studentId ||
        "—";

    studentType.textContent =
        data.studentType ||
        user.studentType ||
        "—";

    verifiedBy.textContent =
        data.verifiedBy ||
        data.verifierName ||
        data.verifiedByName ||
        "—";

    verifiedRole.textContent =
        String(
            data.verifiedRole ||
            data.verifierRole ||
            data.role ||
            "—"
        ).toUpperCase();

    verifiedAt.textContent =
        formatDate(
            data.verifiedAt ||
            data.createdAt ||
            new Date().toISOString()
        );
}


/* =========================
   DISPLAY FAILURE
========================= */

function showFailure(data) {

    emptyResult.style.display =
        "none";

    result.classList.add(
        "show"
    );


    resultStatus.textContent =
        "✕ ENTRY REJECTED";

    resultStatus.className =
        "status error";


    studentName.textContent =
        data.studentName ||
        "Not verified";


    studentId.textContent =
        data.studentId ||
        "—";


    studentType.textContent =
        data.studentType ||
        "—";


    verifiedBy.textContent =
        data.verifiedBy ||
        "—";


    verifiedRole.textContent =
        data.verifiedRole ||
        "—";


    verifiedAt.textContent =
        formatDate(
            data.verifiedAt
        );
}


/* =========================
   DATE FORMAT
========================= */

function formatDate(value) {

    if (!value) {
        return "—";
    }


    try {

        const date =
            new Date(value);


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return String(value);
        }


        return date.toLocaleString(
            "en-IN",
            {
                dateStyle:
                    "medium",

                timeStyle:
                    "medium"
            }
        );

    } catch {

        return String(value);
    }
}


/* =========================
   CHECK LOGIN
========================= */

async function checkLogin() {

    try {

        const data =
            await apiRequest(
                "/api/me"
            );


        const user =
            data.user ||
            data;


        const role =
            String(
                user.role || ""
            ).toUpperCase();


        if (
            role !== "SECURITY" &&
            role !== "SUPER_ADMIN"
        ) {

            showMessage(
                "This account is not authorized for the Security Portal.",
                "error"
            );

            disableControls();

            return false;
        }


        roleBadge.textContent =
            role === "SUPER_ADMIN"
                ? "SUPER ADMIN"
                : "SECURITY";


        return true;

    } catch {

        showMessage(
            "Please login with your Security or Super Admin account.",
            "error"
        );

        disableControls();

        return false;
    }
}


/* =========================
   DISABLE CONTROLS
========================= */

function disableControls() {

    startButton.disabled =
        true;

    stopButton.disabled =
        true;

    fileInput.disabled =
        true;

    fileLabel.classList.add(
        "disabled"
    );
}


/* =========================
   VERIFY QR
========================= */

async function verifyQR(
    decodedText
) {

    if (processing) {
        return;
    }


    if (
        !decodedText ||
        !String(decodedText).trim()
    ) {

        return;
    }


    processing = true;


    showMessage(
        "QR detected. Verifying...",
        "info"
    );


    try {

        const data =
            await apiRequest(
                "/api/verify-qr",
                {
                    method: "POST",

                    body:
                        JSON.stringify(
                            {
                                qrData:
                                    String(
                                        decodedText
                                    )
                            }
                        )
                }
            );


        showSuccess(data);


        showMessage(
            "✓ Entry verified successfully.",
            "success"
        );


    } catch (error) {

        showFailure(
            error.data || {
                message:
                    error.message ||
                    "QR verification failed."
            }
        );


        showMessage(
            error.message ||
            "This QR code was rejected.",
            "error"
        );

    } finally {

        processing = false;

        await stopScanner();
    }
}


/* =========================
   START CAMERA
========================= */

async function startScanner() {

    if (scanning) {
        return;
    }


    if (
        typeof Html5Qrcode ===
        "undefined"
    ) {

        showMessage(
            "QR scanner is still loading. Please wait a moment and try again.",
            "error"
        );

        return;
    }


    resetResult();


    try {

        if (!scanner) {

            scanner =
                new Html5Qrcode(
                    "reader"
                );
        }


        showMessage(
            "Starting camera...",
            "info"
        );


        await scanner.start(

            {
                facingMode:
                    "environment"
            },

            {
                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                },

                aspectRatio: 1.0,

                disableFlip: false
            },

            async decodedText => {

                await verifyQR(
                    decodedText
                );
            },

            () => {}

        );


        scanning = true;


        startButton.disabled =
            true;

        stopButton.disabled =
            false;


        showMessage(
            "Camera ready. Scan the student's DayPass QR.",
            "success"
        );

    } catch {

        scanning = false;

        startButton.disabled =
            false;

        stopButton.disabled =
            true;


        showMessage(
            "Unable to start camera. Allow camera permission or use Gallery.",
            "error"
        );
    }
}


/* =========================
   STOP CAMERA
========================= */

async function stopScanner() {

    if (!scanner) {
        return;
    }


    if (!scanning) {

        startButton.disabled =
            false;

        stopButton.disabled =
            true;

        return;
    }


    try {

        await scanner.stop();

    } catch {
        // Scanner may already be stopped.
    }


    try {

        scanner.clear();

    } catch {
        // Ignore clear errors.
    }


    scanning = false;


    startButton.disabled =
        false;

    stopButton.disabled =
        true;
}


/* =========================
   GALLERY SCANNER
========================= */

async function scanImage(file) {

    if (!file) {
        return;
    }


    if (
        typeof Html5Qrcode ===
        "undefined"
    ) {

        showMessage(
            "QR scanner is still loading. Please wait and try again.",
            "error"
        );

        fileInput.value =
            "";

        return;
    }


    resetResult();


    showMessage(
        "Reading QR from image...",
        "info"
    );


    try {

        await stopScanner();


        if (!scanner) {

            scanner =
                new Html5Qrcode(
                    "reader"
                );
        }


        const decoded =
            await scanner.scanFile(
                file,
                true
            );


        if (!decoded) {

            throw new Error(
                "No QR code found"
            );
        }


        await verifyQR(
            decoded
        );

    } catch {

        showMessage(
            "No QR code was found in this image. Please select a clear DayPass QR screenshot.",
            "error"
        );

    } finally {

        fileInput.value =
            "";
    }
}


/* =========================
   LOGOUT
========================= */

async function logout() {

    try {

        await apiRequest(
            "/api/logout",
            {
                method: "POST"
            }
        );

    } catch {
        // Continue local logout.
    }


   sessionStorage.removeItem("entrypass_token");
localStorage.removeItem("entrypass_token");

sessionStorage.removeItem("token");
sessionStorage.removeItem("idToken");

localStorage.removeItem("token");
localStorage.removeItem("idToken");

    window.location.href =
        "/admin-login.html";
}


/* =========================
   EVENTS
========================= */

startButton.addEventListener(
    "click",
    startScanner
);


stopButton.addEventListener(
    "click",
    stopScanner
);


fileInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files &&
            event.target.files[0];

        scanImage(file);
    }
);


logoutButton.addEventListener(
    "click",
    logout
);


/* =========================
   PAGE LOAD
========================= */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        resetResult();

        await checkLogin();
    }
);


/* =========================
   PAGE CLOSE
========================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (scanner && scanning) {

            scanner.stop()
                .catch(() => {});
        }
    }
);

</script>

</body>
</html>
